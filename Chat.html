<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="theme-color" content="black" />


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Linefont:wdth,wght@83.6,409&family=Marck+Script&family=Nanum+Pen+Script&family=Rock+Salt&family=Trade+Winds&family=Zen+Old+Mincho:wght@400;500;700;900&display=swap"
    rel="stylesheet">

<link href="./Chat/ChatStyle.css" rel="stylesheet">
</link>

<!--Chatroom Begins here!-->
<div id="page">

    <div id="UserDisplay"><span id="UserCount">0</span> user<span id="userPluralization">s</span> online.</div>

    <div id="messageWindow">
        <div id="messageBox"></div>
        <button id="ToBottom" onClick="toBottom()" hidden="true">...<br>▽</button>
    </div>

    <div id="UserInput">
        <div id="Dashboard">
            <div id="AuthorInfo">
                <div id="Nametag">
                    Author: <input id="Author" placeholder="Anonymous" onchange="setUser()"
                        onclick="this.select()"></input>

                    <input id="Color" placeholder="Color" onInput="setColor(this)" onchange="setUser()"
                        onclick="this.select()"></input>

                    <input type="checkbox" id="CaptureBg" onchange="setUser()" />
                </div>

                <div>
                    <input type="range" id="Volume" min="0" max="100" value="50" step="1"
                        oninput="setVolume(this.value); setUser()" />
                </div>

                <div id="styleButtons">
                    <input id="StylePreset" placeHolder="Style" onclick="this.select()" />
                    <button id="StyleButton" onclick="addBar();">Bar</button>
                </div>

            </div>

            <div id="Clock"></div>
            <script>
                setInterval(() => document.getElementById("Clock").textContent = new Date().toUTCString(), 1000)
            </script>
        </div>
        <div id="editor">
            <TextArea id="DraftBox" placeHolder="Enter Message..." prewrap="wrap"
                onKeyDown="if(!event.shiftKey && event.key=='Enter' ){send(this,Author,Color)}; if(event.key=='|'){event.preventDefault(); addBar()}"
                onclick="playNotifs=true;"></TextArea>
            <div id="mobileButtons">
                <button id="LineBreak"
                    onClick="newLine(); buttonPress.currentTime=0; buttonPress.play();">Line<br>Break</button>
                <button id="SendButton"
                    onclick="send(DraftBox,Author,Color); buttonPress.currentTime=0; buttonPress.play();">Send!</button>

            </div>
        </div>
    </div>
</div>

<!--Page Functions-->
<script>
    //Prime Declarations
    var messageBox = document.getElementById("messageBox");
    var caughtUp = true;
    var capturedBG = false;
    //Collect Users.
    var rawUserNames = document.getElementsByClassName("pastAuthor");
    //compile Replies for later
    var replyTargets = document.getElementsByClassName("reply2this");
    var onlineStatus;

    //audio Definitions.
    var playNotifs = false;
    var messageNotif = new Audio("./Assets/Audio/Chatroom/MessageAlert.mp3");
    var entryNotif = new Audio("./Assets/Audio/Chatroom/EntryAlert.mp3");
    var exitNotif = new Audio("./Assets/Audio/Chatroom/ExitAlert.mp3");
    var buttonPress = new Audio("./Assets/Audio/Chatroom/ButtonPress.mp3");


    //Functions
    //Set color demo.
    var userColor;
    function setColor(color) {
        var root = document.documentElement;
        root.style.setProperty("--AuthorColor", color.value);
        userColor = getComputedStyle(root).getPropertyValue("--AuthorColor")
    }

    //Load user
    function loadUser() {
        var author = document.getElementById("Author")
        var color = document.getElementById("Color")
        var bgLock = document.getElementById("CaptureBg")
        var vol = document.getElementById("Volume")
        var style = document.getElementById("StylePreset")
        console.log(document.cookie)
        if (document.cookie) {
            var settings = document.cookie.split(", ");

            onlineStatus = document.cookie.split(";")[1]


            author.value = settings[0];
            color.value = settings[1];

            if (settings[2] == "true") {
                bgLock.checked = true;
            } else bgLock.checked = false;


            capturedBG = parseInt(settings[3]);

            vol.value = parseInt(settings[4]);

            if (settings[5]) {
                style.value = settings[5];
            }

            setVolume(vol.value);


        } else {
            author.value = "Anonymous";
            color.value = "skyblue";
            bgLock.checked === false;
        }

        setColor(color);
    }
    //Collect reply targets
    function reply2This(target) {
        target.classList.toggle("reply2this")
        document.getElementById("DraftBox").focus()
    }

    //Give Space when jumping
    function giveBerth() {
        var hilights = document.getElementsByClassName("Highlight");
        Array.from(hilights).forEach((x) => x.classList.remove("Highlight"));

        messageBox.scrollBy({
            top: -messageBox.clientHeight * .2,
        });

        document.getElementById(window.location.hash.substring(1)).classList.add("Highlight");

        setTimeout(() => {
            Array.from(hilights).forEach((x) => x.classList.remove("Highlight"));
        }, 1000)

    };

    //Jump to bottom
    function toBottom() {
        messageBox.scrollTo({
            top: messageBox.scrollHeight,
        })
    }

    //MarkDown
    function markDown(textContainer, imgScale) {
        if (textContainer.innerText.match(/([^\|\s>]+)\|([^\|]*)\|/g)) {

            textContainer.innerHTML = textContainer.innerHTML.replace(/([^\|\s]+)\|([^\|]*)\|/g, (match, key, content) => {
                var markDown = "";
                var tagType = "span"
                var textDeco = "";
                var spClass = "";
                var spoiler = "";
                var link = "";

                var filteredColor;

                if (key.toLowerCase().includes("img")) {

                    return "<br><img src='" + content + "' width=" + imgScale + "%><br>"

                }
                if (key.toLowerCase().includes("c.")) {
                    var color = key.match(/c\.([^]+)/i)[1]
                    var root = document.documentElement;

                    root.style.setProperty('--markColor', color);

                    filteredColor = window.getComputedStyle(root).getPropertyValue('--markColor');

                    markDown += "color:" + filteredColor + ";"
                    key = key.replace(/c\.([^]+)/i, "")

                } else if (key.toLowerCase().includes("a.")) {
                    tagType = "a"
                    link = "href='" + key.match(/a\.([^]+)/i)[1] + "'";

                    key = key.replace(/a\.([^]+)/i, "")
                }

                if (key.toLowerCase().includes("f(")) {
                    var animation = key.match(/f\(([^;]+)\)/i)[1]

                    markDown += "animation:" + animation + " 2s infinite linear;"
                    key = key.replace(/f\(([^]+)\)/i, "")

                }

                if (key.toLowerCase().includes("b")) {
                    var textColor = "white";
                    if (filteredColor) {
                        textColor = filteredColor;
                    }

                    markDown += "text-shadow:0em 0em .1em " + textColor + ",0em 0em .1em " + textColor + ",0em 0em .1em " + textColor + ";"
                }
                if (key.toLowerCase().includes("i")) {
                    markDown += "font-style:italic;"
                }
                if (key.toLowerCase().includes("s")) {
                    markDown += "font-size:.7em;"
                }
                if (key.toLowerCase().includes("l")) {
                    markDown += "font-size:1.4em;"
                }
                if (key.toLowerCase().includes("_")) {
                    textDeco += "underline "
                }
                if (key.toLowerCase().includes("-")) {
                    textDeco += "line-through "
                }
                if (key.toLowerCase().includes("m")) {
                    tagType = "marquee"
                }
                if (key.toLowerCase().includes("q")) {
                    tagType = "blockquote"
                }
                if (key.toLowerCase().includes("h")) {
                    spClass += "spoiler spoilerPrimer"
                    spoiler = 'onclick="event.stopPropagation();this.classList.toggle(\'spoiler\')"';
                }
                //Fonts
                if (key.toLowerCase().includes("~")) {
                    markDown += "font-family: Marck Script;"
                }
                //Rock Salt is awesome
                if (key.toLowerCase().includes("!")) {
                    markDown += "font-family: Trade Winds;"
                }
                if (key.toLowerCase().includes("/")) {
                    markDown += "font-family: Nanum Pen Script;"
                }
                if (key.toLowerCase().includes("\\")) {
                    markDown += "font-family: rock salt;"
                }
                if (key.toLowerCase().includes("w")) {
                    markDown += "font-family: linefont;"
                }
                if (key.toLowerCase().includes("j")) {
                    markDown += "font-family: Dela Gothic One;"
                }
                if (key.includes("V")) {
                    markDown += "writing-mode:vertical-lr; text-orientation:upright;"
                }
                if (key.includes("v")) {
                    markDown += "writing-mode:vertical-lr; text-orientation:mixed;"
                }
                if (key.toLowerCase().includes("d")) {
                    markDown += "display:inline-block; transform:rotate(90deg); transform-origin:left;"
                }
                if (key.toLowerCase().includes("x")) {
                    markDown += "display:inline-block; transform:scalex(-1);"
                }
                if (key.toLowerCase().includes("y")) {
                    markDown += "display:inline-block; transform:scaley(-1);"
                }



                return "<" + tagType + " style='" + markDown + "text-decoration:" + textDeco + ";' " + spoiler + " class='" + spClass + " mark' " + link + ">" + content + "</" + tagType + ">"

            })
        }
    }

    //Stickers
    function addSticker(textContainer) {
        if (textContainer.innerText.match(/:(\w+):/g)) {
            textContainer.innerHTML = textContainer.innerHTML.replace(/\s:(\w+):/g, (match, sticker) => {
                var url = "./Chat/Stickers/" + sticker.toLowerCase()
                return "<img class='sticker' src='" + url + ".gif'>"
            })
        }
    }

    //LineBreak Button
    function newLine() {
        var text = document.getElementById("DraftBox");
        text.focus();

        var cursor = text.selectionStart;
        var endString = text.value.slice(cursor)

        text.value = text.value.substring(0, cursor) + "\n" + endString;

        text.selectionStart = cursor + 1;
        text.selectionEnd = cursor + 1;

    }

    //add bar button
    function addBar() {
        buttonPress.currentTime = 0;
        buttonPress.play();
        var editor = document.getElementById("DraftBox")
        var preset = document.getElementById("StylePreset")
        var text = editor.value

        editor.focus();

        var start = editor.selectionStart;
        var end = editor.selectionEnd;
        var selection = editor.value.substring(start, end);
        var endString = text.slice(end)
        var cursor = start;



        if (selection) {
            cursor = end + 1 + preset.value.length;

            editor.value = text.substring(0, start) + preset.value + "|" + selection + "|" + endString;
        } else {
            editor.value = text.substring(0, start) + "|" + endString;

        }

        editor.selectionStart = cursor + 1;
        editor.selectionEnd = cursor + 1;


    }

    //Volume
    function setVolume(volume) {
        messageNotif.volume = volume / 100;
        entryNotif.volume = volume / 100;
        exitNotif.volume = volume / 100;
    }

    //Event Listeners
    window.addEventListener('hashchange', function () {
        giveBerth();
    })


    //Initialize
    loadUser()

</script>
<!--Server Functions-->
<script type="module">
    //Load Firebase DB.
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    //Firebase Functions
    import {
        getDatabase,
        query,
        limitToLast,
        onChildAdded,
        onDisconnect,
        ref,
        get,
        set,
        onValue,
        increment,
        push
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    //Get RATTRAPS Log
    const fbAddress = {
        databaseURL: "https://rattraps-3rd-edition-default-rtdb.firebaseio.com"
    };
    const db = getDatabase(initializeApp(fbAddress));

    //Key Declarations
    var logLimit = 100;
    var messageLogAddress = ref(db, "Chatroom/MessageLog");
    var messageHistory = query(messageLogAddress, limitToLast(logLimit))
    var newId;

    var users = "Chatroom/Users";
    var showNotifs = false;



    //Send Message.--------------------------------------!!!
    window.send = function (draft, author, color) {
        //Prevent raw enter key from line breaking
        event.preventDefault();
        draft.focus()

        if (!draft.value) {
            return
        }
        if (!author.value) {
            author.value = "Anonymous"
            return
        }
        if (!color.value) {
            color.value = "skyblue"
            return
        }
        //format replies
        var replyCodes = "";
        if (replyTargets.length > 0) {
            var replyCodes = Array.from(replyTargets).map((x) => {
                x.classList.toggle("reply2this");
                return x.id;
            })
            replyCodes = replyCodes.join(", ")
        }


        //Send Message to server.
        newId = push(messageLogAddress, {
            Author: author.value,
            Color: userColor,
            Message: draft.value,
            Replies: replyCodes,
            Timestamp: new Date().toUTCString()

        })
        //Reset Draft Box.
        draft.value = "";

        //Jump to bottom!
        toBottom();

    }

    //Update chat history.-------------------------------!!!
    onChildAdded(messageHistory, (x) => {

        var chatHistory = messageBox.children;

        //create new message
        var newMessage = document.createElement("div");

        //To determine notif type to play.
        var messageType;

        //Build entry messages--------------------------!!!
        if (x.val().Entrance) {
            if (x.val().Entrance == "Arrival") {
                newMessage.classList.add("Entrance");
                newMessage.innerHTML = "<span style=color:" + x.val().Color + ";>" + x.val().Author + "</span> has apeared! :D";

                messageBox.prepend(newMessage)
                messageType = "Entry";
            } else if (x.val().Entrance == "Exit") {
                newMessage.classList.add("Entrance");
                newMessage.innerHTML = "<span style=color:" + x.val().Color + ";>" + x.val().Author + "</span> has wandered off. :c";

                messageBox.prepend(newMessage)
                messageType = "Exit";
            }
        } else {
            //Build chat messages-----------------------!!!
            newMessage.classList.add("message");
            newMessage.id = x.key
            newMessage.setAttribute("onclick", "reply2This(this)")

            newMessage.innerHTML = "<div class='pastAuthor' style='color:" + x.val().Color + ";'>" + x.val().Author + ":</div>";

            //Formatting for replies---_!!!
            var spacer;
            var replyBlock = false;
            if (x.val().Replies) {
                var replyIDs = new String(x.val().Replies).split(", ")
                replyBlock = document.createElement("div");
                replyBlock.classList.add("quoteBlock");

                var targetMessage;
                var targetText;
                var quoteIndex = 0;
                replyIDs.forEach((y) => {
                    replyBlock.insertAdjacentHTML("beforeEnd",
                        "<a href='#" + y + "'></a>"
                    )
                })

                spacer = "⤷ ";
            } else spacer = "      ";

            var newText = document.createElement("div")
            newText.appendChild(document.createTextNode(spacer + x.val().Message));
            newMessage.appendChild(newText)


            newMessage.insertAdjacentHTML("beforeend", "<div class='TimeStamp'>" + x.val().Timestamp + "</div>")

            //Add message to history.
            if (replyBlock) {
                var bigBlock = document.createElement("div")
                bigBlock.appendChild(replyBlock);
                bigBlock.appendChild(newMessage);

                messageBox.prepend(bigBlock);

                //Load replies
                Array.from(bigBlock.children[0].children).forEach((x) => {
                    var targetId = x.getAttribute("href").slice(1)

                    get(ref(db, "Chatroom/MessageLog/" + targetId)).then((y) => {
                        var quote = y.val();
                        //Cite message
                        x.innerText = quote.Message
                        markDown(x, 20)
                        addSticker(x)

                        //Cite Auther
                        x.insertAdjacentHTML("beforeEnd",
                            "<div style='color:" + quote.Color + ";'>- " + quote.Author + "</div>"
                        )

                        toBottom();
                    })
                })
            } else messageBox.prepend(newMessage);


            //formatting-----------------------------!!!
            //Markdown
            markDown(newMessage, 70);
            addSticker(newMessage)


            //@ Users-------------------------------!!!
            var messageContent = newMessage.children[1].innerHTML;
            if (messageContent.match("@")) {
                Array.from(rawUserNames).forEach((name) => {
                    if (messageContent.toLowerCase().includes("@" + name.innerText.slice(0, -1).toLowerCase())) {
                        messageContent = messageContent.replace(new RegExp(`@(${name.innerText.slice(0, -1)})`, "gi"), "<span style='animation: Glow 2s infinite; " + name.getAttribute("style") + ";'>$1</span>")

                        //update message with formatted @s
                        newMessage.children[1].innerHTML = messageContent
                    }
                })
            }



        }
        //Remove oldest message.
        if (caughtUp) {
            toBottom();
            if (chatHistory.length > logLimit) {
                while (messageBox.children.length > logLimit) {
                    messageBox.children[messageBox.children.length].remove()
                }
            }
        }
        //Play notifications.------------------!!!
        if (playNotifs) {
            if (messageType == "Entry") {
                entryNotif.play();
            } else if (messageType == "Exit") {
                exitNotif.play();
            } else messageNotif.play();
        }
    })

    //Remember User
    window.setUser = function () {
        var name = document.getElementById("Author");
        var color = document.getElementById("Color");
        var bgLock = document.getElementById("CaptureBg");
        var vol = document.getElementById("Volume");
        var style = document.getElementById("StylePreset");

        if (name.value.includes(",")) {
            return
        }
        var expires = new Date(Date.now() + 72 * 60 * 60 * 1000);

        var background = window.getComputedStyle(messageBox).
            getPropertyValue("background-image");
        var currentBG = parseInt(background.slice(62, -6))

        if (bgLock.checked) {
            capturedBG = currentBG
        } else if (!bgLock.checked) {
            capturedBG = false;
        }


        document.cookie = name.value + ", " + color.value + ", " + bgLock.checked + ", " + capturedBG + ", " + vol.value + ", " + style.value + ";" + onlineStatus + ";" + "expires=" + expires;


    }

    //Module event listeners
    messageBox.addEventListener("scroll", (x) => {
        var scrollPosition = x.target.scrollTop;
        var total = messageBox.scrollHeight
        var scale = messageBox.clientHeight
        var jumpButton = document.getElementById("ToBottom");

        if (scrollPosition >= -100) {
            caughtUp = true;
            jumpButton.setAttribute("hidden", true);
        } else {
            caughtUp = false;
            jumpButton.removeAttribute("hidden");
        }
        
        
        console.log(caughtUp)

    })


    // Turn off entry messages.
    document.addEventListener("visibilitychange", () => {
        //When page is hidden.

        if (document.hidden && onlineStatus) {
            set(ref(db, users + "/Count"), increment(-1))

            onlineStatus = false
            setUser();
            push(messageLogAddress, {
                Author: document.getElementById("Author").value,
                Color: userColor,
                Entrance: "Exit",
                Timestamp: new Date().toUTCString()
            })

            //Desktop Notifications
            showNotifs = true;

            //When page is Visible.

        } else if (!document.hidden && !onlineStatus) {
            set(ref(db, users + "/Count"), increment(1))

            onlineStatus = true
            setUser();

            push(messageLogAddress, {
                Author: document.getElementById("Author").value,
                Color: userColor,
                Entrance: "Arrival",
                Timestamp: new Date().toUTCString()
            })

            //Desktop Notifications
            showNotifs = false;
        }

    });

    //Prime Arival Message.
    setTimeout(() => {
        onlineStatus = true;
        setUser();
        set(ref(db, users + "/Count"), increment(1))
        push(messageLogAddress, {
            Author: document.getElementById("Author").value,
            Color: userColor,
            Message: "Penis penis penis",
            Entrance: "Arrival",
            Timestamp: new Date().toUTCString()
        })
    }, 1000)
    //Turn off enrty messages */

    //Count online users
    onValue(ref(db, users + "/Count"), (x) => {
        var userCount = document.getElementById("UserCount");
        var pluralize = document.getElementById("userPluralization");

        userCount.innerText = x.val()
        if (x.val() == "1") {
            pluralize.innerText = ""
        } else pluralize.innerText = "s"
    })

</script>

        white-space: pre-wrap;

<script>
    var bgOptions = 24.1;
    var url = "https://warmest-soup.github.io/Assets/Images/ChatroomBGs/";

    bgNumber = Math.round(Math.random() * bgOptions);

    if (capturedBG) {
        bgNumber = capturedBG;
    }

    var randBG = url + bgNumber;
    document.getElementById("messageBox").style.backgroundImage = "url('" + randBG + ".gif')";



</script>
