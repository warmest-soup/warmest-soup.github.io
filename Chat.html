<!--Chatroom Begins here!-->
<div id="page">

    <div id="UserDisplay"><span id="UserCount">0</span> user<span id="userPluralization">s</span> online.</div>

    <div id="messageBox"></div>

    <div id="UserInput">
        <div id="Dashboard">
            <div id="AuthorInfo">
                Author: <input id="Author" placeholder="Anonymous" onchange="setUser(this, Color, CaptureBg)"></input>

                <input id="Color" placeholder="Color" onInput="setColor(this)"
                    onchange="setUser(Author, this, CaptureBg)"></input>

                <input type="checkbox" id="CaptureBg" onchange="setUser(Author, Color, this)" />

            </div>

            <div id="Clock"></div>
            <script>
                setInterval(() => document.getElementById("Clock").textContent = new Date().toUTCString(), 1000)
            </script>
        </div>
        <div id="editor">
            <TextArea id="DraftBox" placeHolder="Enter Message..." prewrap="wrap"
                onKeyDown="if(!event.shiftKey && event.key=='Enter'){send(this,Author,Color)}"></TextArea>
            <div id="mobileButtons">
                <button id="SendButton" onclick="send(DraftBox,Author,Color)">Send!</button>
                <button id="LineBreak" onClick="newLine()">Line<br>Break</button>
            </div>
        </div>
    </div>
</div>

<!--Page Functions-->
<script>
    //Prime Declarations
    var messageBox = document.getElementById("messageBox");
    var caughtUp = true;
    var capturedBG = false;
    //Collect Users.
    var rawUserNames = document.getElementsByClassName("pastAuthor");
    //compile Replies for later
    var replyTargets = document.getElementsByClassName("reply2this");

    //Functions
    //Set color demo.
    var userColor;
    function setColor(color) {
        var root = document.documentElement;
        root.style.setProperty("--AuthorColor", color.value);
        userColor = getComputedStyle(root).getPropertyValue("--AuthorColor")
    }

    //Load user
    function loadUser() {
        var author = document.getElementById("Author")
        var color = document.getElementById("Color")
        var bgLock = document.getElementById("CaptureBg")

        if (document.cookie) {
            var settings = document.cookie.split(", ");
            author.value = settings[0];
            color.value = settings[1];

            if (settings[2] == "true") {
                bgLock.checked = true;
            } else bgLock.checked = false;


            capturedBG = parseInt(settings[3]);


        } else {
            author.value = "Anonymous";
            color.value = "skyblue";
            bgLock.checked === false;
        }

        setColor(color);
    }
    //Collect reply targets
    function reply2This(target) {
        target.classList.toggle("reply2this")
        document.getElementById("DraftBox").focus()
    }

    //Give Space when jumping
    function giveBerth() {
        var hilights = document.getElementsByClassName("Highlight");
        Array.from(hilights).forEach((x) => x.classList.remove("Highlight"));

        messageBox.scrollBy({
            top: -messageBox.clientHeight * .2,
        });

        document.getElementById(window.location.hash.substring(1)).classList.add("Highlight");

        setTimeout(() => {
            Array.from(hilights).forEach((x) => x.classList.remove("Highlight"));
        }, 1000)

    };

    //Jump to bottom
    function toBottom() {
        messageBox.scrollTo({
            top: messageBox.scrollHeight,
        })
    }

    //MarkDown
    function markDown(textContainer, imgScale) {
        if (textContainer.innerText.match(/([^\|\s>]+)\|([^\|]*)\|/g)) {

            textContainer.innerHTML = textContainer.innerHTML.replace(/([^\|\s]+)\|([^\|]*)\|/g, (match, key, content) => {
                var markDown = ""
                var tagType = "span"
                var textDeco = "";
                var spClass = ""
                var spoiler = ""

                if (key.toLowerCase().includes("img")) {

                    return "<br><img src='" + content + "' width=" + imgScale + "%><br>"

                }

                if (key.toLowerCase().includes("b")) {
                    markDown += "text-shadow:0em 0em .1em white,0em 0em .1em white,0em 0em .1em white,0em 0em .1em white,0em 0em .1em white;"
                }
                if (key.toLowerCase().includes("i")) {
                    markDown += "font-style:italic;"
                }
                if (key.toLowerCase().includes("s")) {
                    markDown += "font-size:.7em;"
                }
                if (key.toLowerCase().includes("l")) {
                    markDown += "font-size:1.4em;"
                }
                if (key.toLowerCase().includes("_")) {
                    textDeco += "underline "
                }
                if (key.toLowerCase().includes("-")) {
                    textDeco += "line-through "
                }
                if (key.toLowerCase().includes("m")) {
                    tagType = "marquee"
                }
                if (key.toLowerCase().includes("q")) {
                    tagType = "blockquote"
                }
                if (key.toLowerCase().includes("h")) {
                    spClass += "spoiler spoilerPrimer"
                    spoiler = 'onclick="event.stopPropagation();this.classList.toggle(\'spoiler\')"';

                }

                return "<" + tagType + " style='" + markDown + "text-decoration:" + textDeco + ";' " + spoiler + " class='" + spClass + "'>" + content + "</" + tagType + ">"

            })
        }
    }

    //LineBreak Button
    function newLine() {
        var text = document.getElementById("DraftBox");
        text.focus();

        var cursor = text.selectionStart;
        var endString = text.value.slice(cursor)
        
        text.value = text.value.substring(0, cursor) + "\n" + endString;
        text.selectionStart=cursor+1;
        text.selectionEnd=cursor+1;
        
        console.log(text.value)

    }

    //Event Listeners
    window.addEventListener('hashchange', function () {
        giveBerth();
    })

    //Initialize
    loadUser()

</script>
<!--Server Functions-->
<script type="module">
    //Load Firebase DB.
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    //Firebase Functions
    import {
        getDatabase,
        query,
        limitToLast,
        onChildAdded,
        onChildRemoved,
        onDisconnect,
        ref,
        get,
        set,
        onValue,
        increment,
        push
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    //Get RATTRAPS Log
    const fbAddress = {
        databaseURL: "https://rattraps-3rd-edition-default-rtdb.firebaseio.com"
    };
    const db = getDatabase(initializeApp(fbAddress));

    //Key Declarations
    var logLimit = 100;
    var messageLogAddress = ref(db, "Chatroom/MessageLog");
    var messageHistory = query(messageLogAddress, limitToLast(logLimit))
    var newId;

    var users = "Chatroom/Users";
    var playAlerts = false;
    var alertSound = new Audio("https://warmest-soup.github.io/Assets/Audio/ButtonClick.mp3");

    //Send Message.--------------------------------------!!!
    window.send = function (draft, author, color) {
        //Prevent raw enter key from line breaking
        event.preventDefault();
        draft.focus()

        if (!draft.value) {
            return
        }
        if (!author.value) {
            author.value = "Anonymous"
            return
        }
        if (!color.value) {
            color.value = "skyblue"
            return
        }
        //format replies
        var replyCodes = "";
        if (replyTargets.length > 0) {
            var replyCodes = Array.from(replyTargets).map((x) => {
                x.classList.toggle("reply2this");
                return x.id;
            })
            replyCodes = replyCodes.join(", ")
        }


        //Send Message to server.
        newId = push(messageLogAddress, {
            Author: author.value,
            Color: userColor,
            Message: draft.value,
            Replies: replyCodes,
            Timestamp: new Date().toUTCString()

        })
        //Reset Draft Box.
        draft.value = "";

        //Jump to bottom!
        toBottom();

    }

    //Update chat history.-------------------------------!!!
    onChildAdded(messageHistory, (x) => {

        var chatHistory = messageBox.children;

        //create new message
        var newMessage = document.createElement("div");

        //Build entry messages--------------------------!!!
        if (x.val().Entrance) {
            if (x.val().Entrance == "Arrival") {
                newMessage.classList.add("Entrance");
                newMessage.innerHTML = "<span style=color:" + x.val().Color + ";>" + x.val().Author + "</span> has Apeared! :D";

                messageBox.appendChild(newMessage)
            } else if (x.val().Entrance == "Exit") {
                newMessage.classList.add("Entrance");
                newMessage.innerHTML = "<span style=color:" + x.val().Color + ";>" + x.val().Author + "</span> has wandered off. :c";

                messageBox.appendChild(newMessage)
            }
        } else {
            //Build chat messages-----------------------!!!
            newMessage.classList.add("message");
            newMessage.id = x.key
            newMessage.setAttribute("onclick", "reply2This(this)")

            newMessage.innerHTML = "<div class='pastAuthor' style='color:" + x.val().Color + ";'>" + x.val().Author + ":</div>";

            //Formatting for replies---_!!!
            var spacer;
            var replyBlock = false;
            if (x.val().Replies) {
                var replyIDs = new String(x.val().Replies).split(", ")
                replyBlock = document.createElement("div");
                replyBlock.classList.add("quoteBlock");

                var targetMessage;
                var targetText;
                var quoteIndex = 0;
                replyIDs.forEach((y) => {
                    replyBlock.insertAdjacentHTML("beforeEnd",
                        "<a href='#" + y + "'></a>"
                    )
                })

                spacer = "⤷ ";
            } else spacer = "      ";

            var newText = document.createElement("div")
            newText.appendChild(document.createTextNode(spacer + x.val().Message));
            newMessage.appendChild(newText)


            newMessage.insertAdjacentHTML("beforeend", "<div class='TimeStamp'>" + x.val().Timestamp + "</div>")

            //Add message to history.
            if (replyBlock) {
                var bigBlock = document.createElement("div")
                bigBlock.appendChild(replyBlock);
                bigBlock.appendChild(newMessage);

                messageBox.appendChild(bigBlock);

                //Load replies
                Array.from(bigBlock.children[0].children).forEach((x) => {
                    var targetId = x.getAttribute("href").slice(1)

                    get(ref(db, "Chatroom/MessageLog/" + targetId)).then((y) => {
                        var quote = y.val();
                        //Cite message
                        x.innerText = quote.Message
                        markDown(x, 20)


                        //Cite Auther
                        x.insertAdjacentHTML("beforeEnd",
                            "<div style='color:" + quote.Color + ";'>- " + quote.Author + "</div>"
                        )

                        toBottom();
                    })
                })
            } else messageBox.appendChild(newMessage);


            //formatting-----------------------------!!!
            //Markdown
            markDown(newMessage, 70);


            //@ Users-------------------------------!!!
            var messageContent = newMessage.children[1].innerHTML;
            if (messageContent.match("@")) {
                Array.from(rawUserNames).forEach((name) => {
                    if (messageContent.toLowerCase().includes("@" + name.innerText.slice(0, -1).toLowerCase())) {
                        messageContent = messageContent.replace(new RegExp(`@(${name.innerText.slice(0, -1)})`, "gi"), "<span style='animation: Glow 2s infinite; " + name.getAttribute("style") + ";'>$1</span>")

                        //update message with formatted @s
                        newMessage.children[1].innerHTML = messageContent
                    }
                })
            }

            //Enable notifications.------------------!!!
            if (playAlerts) {
                alertSound.play();
            }

        }
        //Remove oldest message.
        if (caughtUp) {
            toBottom();
            if (chatHistory.length > logLimit) {
                while (messageBox.children.length > logLimit) {
                    messageBox.children[0].remove()
                }
            }
        }
    })

    messageBox.addEventListener("scroll", (x) => {
        var scrollPosition = x.target.scrollTop;
        var total = messageBox.scrollHeight
        var scale = messageBox.clientHeight

        if (scrollPosition >= total - scale * 1.5) {
            caughtUp = true;
        } else caughtUp = false;


    })

    //Remember User
    window.setUser = function (name, color, bgLock) {
        if (name.value.includes(",")) {
            return
        }
        var expires = new Date(Date.now() + 72 * 60 * 60 * 1000);

        var background = window.getComputedStyle(messageBox).
            getPropertyValue("background-image");
        var currentBG = parseInt(background.slice(62, -6))

        if (bgLock.checked) {
            capturedBG = currentBG
        } else if (!bgLock.checked) {
            capturedBG = false;
        }
        document.cookie = name.value + ", " + color.value + ", " + bgLock.checked + ", " + capturedBG + "; expires=" + expires;


        onDisconnect(messageLogAddress).cancel()
        onDisconnect(push(messageLogAddress)).set({
            Author: document.getElementById("Author").value,
            Color: userColor,
            Message: "has wandered off. :c",
            Entrance: "Exit",
            Timestamp: new Date().toUTCString()
        })
    }

    //Count online users
    onValue(ref(db, users + "/Count"), (x) => {
        var userCount = document.getElementById("UserCount");
        var pluralize = document.getElementById("userPluralization");

        userCount.innerText = x.val()
        if (x.val() == "1") {
            pluralize.innerText = ""
        } else pluralize.innerText = "s"
    })

    //Users Online---------------------------------------!!!
    onValue(ref(db, ".info/connected"), (x) => {
        if (x.val()) {
            set(ref(db, users + "/Count"), increment(1));
        } //else set(ref(db, users + "/Count"), increment(-1));
        playAlerts = true;
    })
    onDisconnect(ref(db, users + "/Count")).set(increment(-1))
    /*onDisconnect(push(messageLogAddress)).set({
        Author: document.getElementById("Author").value,
        Color: userColor,
        Message: "has wandered off. :c",
        Entrance: "Exit",
        Timestamp: new Date().toUTCString()
    })
    /*Entrance Message
    setTimeout(() => {
        push(messageLogAddress, {
            Author: document.getElementById("Author").value,
            Color: userColor,
            Message: "has appeared! :D",
            Entrance: "Arrival",
            Timestamp: new Date().toUTCString()
        })
    }, 500)
    */
</script>

    var url = "https://warmest-soup.github.io/Assets/Images/ChatroomBGs/";

    bgNumber = Math.round(Math.random() * bgOptions);

    if (capturedBG) {
        bgNumber = capturedBG;
    }

    var randBG = url + bgNumber;
    document.getElementById("messageBox").style.backgroundImage = "url('" + randBG + ".gif')";



</script>
