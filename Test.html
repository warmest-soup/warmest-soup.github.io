    href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Linefont:wdth,wght@83.6,409&family=Marck+Script&family=Nanum+Pen+Script&family=Rock+Salt&family=Trade+Winds&family=Zen+Old+Mincho:wght@400;500;700;900&display=swap"
    rel="stylesheet">

<div id="textDisplay" onchange="markDown(this, 20); addSticker(this); openStickers(this);"
    onkeydown="if(event.key=='Backspace') {clearMarks()}" prewrap="wrap">Enter message...
</div>

<textarea id="textbox"
    oninput="textDisplay.innerText = this.value; markDown(textDisplay, 20); addSticker(textDisplay); openStickers(textDisplay); document.cookie=this.value"
    onkeydown="if(event.key=='Backspace') {clearMarks()}" prewrap="wrap" placeholder="Enter message...">
</textarea>

<div id="StickerList" hidden>
</div>
<style>
    #StickerList {
        position: fixed;
        z-index: +2;
        top: 0;
        left: 0;
        background: black;
    }
</style>
 
 
<script>
    
    // Toggle this code off when updating because it breaks cookie support on the Chat potentially.
    var textbox = document.getElementById("textbox")
    var textDisplay = document.getElementById("textDisplay"); 
    textbox.value = document.cookie
    textDisplay.innerText = textbox.value
    
    markDown(textDisplay, 20); 
    addSticker(textDisplay); 
    openStickers(textDisplay);
    // End toggle here! */

    //Stickers
    //Stickers
    var stickerList = [
        "svencry, gif",
        "svenlaugh, gif",
        "svennuzzle, gif",
        "svenshit, png",
        "vcat, gif",
        "vhonestjo, jpg",
        "vsunpuppy, png",
        "vwtf, jpg",
        "souphuhu, png",
        "soupracoon, png",
        "meowwalk, gif",
        "mangosilence, png",
        "mangoangy, png",
        "mangoeep, png",
        "mangoface, png",
        "mangofat, png",
        "mangogo, png",
        "mangolaugh, png",
        "mangono, png",
        "mangook, png",
        "mangosurprise, png",
        "mangosweat, png",
        "mangochew, png",
        "tribow, gif",
        "trifaint, gif",
        "tripunch, gif",
        "triwave, gif"
    ];
    //Open sticker menu
    function openStickers(textContainer) {
        var cursor = textContainer.selectionStart
        var matching = textContainer.innerText.substring(0, cursor).match(/:([a-z]+)$/);
        var stickerMenu = document.getElementById("StickerList");

        if (matching) {
            stickerMenu.removeAttribute("Hidden");

            stickerMenu.innerHTML = "";
            stickerList.forEach((x) => {
                var stickerType = x.split(", ")[1]
                var stickerName = x.split(", ")[0]


                if (stickerName.match(matching[0].substring(1))) {
                    stickerMenu.innerHTML += "<div onclick='insertSticker(textbox, this.innerText)'>:" + stickerName + ":<br>" + stickerName + "</div>";

                    addSticker(stickerMenu)
                }
            })
        } else stickerMenu.setAttribute("Hidden", "true");
    }
    //Add sticker from menu
    function insertSticker(textContainer, sticker) {
        var cursor = textContainer.selectionStart
        var text = textContainer.value.substring(0, cursor)
        var textEnd = textContainer.value.substring(cursor)
        var stickerMenu = document.getElementById("StickerList");

        text = text.replace(/:([a-z]+)$/, ":" + sticker.substring(1) + ":");

        textContainer.value = text + textEnd;

        stickerMenu.setAttribute("Hidden", "true");
        textContainer.focus()
        textContainer.selectionStart = text.length
        textContainer.selectionEnd = text.length
    }
    //Embed sticker images
    function addSticker(textContainer) {
        if (textContainer.innerText.match(/:([^\w+]):/g)) {
            textContainer.innerHTML = textContainer.innerHTML.replace(/:(\w+):/g, (match, sticker) => {

                var result;

                stickerList.forEach((x) => {
                    var stickerType = x.split(", ")[1]
                    var stickerName = x.split(", ")[0]

                    if (sticker.toLowerCase() == stickerName) {
                        var url = "<img class='sticker' src='./Chat/Stickers/" + stickerName + "." + stickerType + "'>"

                        result = url;
                    }
                })

                if (result) return result;
            })
        }
    }

    //remove MarkDown
    function kill(yourself) {
        if (yourself.innerText) {
            yourself.remove();
        }
    }

    function clearMarks() {
        var editor = Array.from(document.getElementById("textDisplay").children);
        editor.forEach((x) => {
            if (x.classList.contains("mark")) {
                //kill(x)
            }
        })
    }

    //MarkDown
    function markDown(textContainer, imgScale) {
        if (textContainer.innerText.match(/([^\|\s>]+)\|([^\|]*)\|/ig)) {

            textContainer.innerHTML = textContainer.innerHTML.replace(/([^\|\s]+)\|([^\|]*)\|/g, (match, key, content) => {
                var markDown = "";
                var tagType = "span"
                var textDeco = "";
                var spClass = "";
                var spoiler = "";
                var link = "";

                var filteredColor;

                if (key.toLowerCase().includes("img")) {

                    return "<br><img src='" + content + "' width=" + imgScale + "%><br>"

                }
                if (key.toLowerCase().includes("c.")) {
                    var color = key.match(/c\.([^]+)/)[1]
                    var root = document.documentElement;

                    root.style.setProperty('--markColor', color);

                    filteredColor = window.getComputedStyle(root).getPropertyValue('--markColor');

                    markDown += "color:" + filteredColor + ";"
                    key = key.replace(/c\.([^]+)/, "")

                } else if (key.toLowerCase().includes("a.")) {
                    tagType = "a"
                    link = "href='" + key.match(/a\.([^]+)/)[1] + "'";

                    key = key.replace(/a\.([^]+)/, "")
                }
                if (key.toLowerCase().includes("f(")) {
                    var animation = key.match(/f\(([^;]+)\)/i)[1]

                    animations = animation.split(".");

                    markDown += "animation:"

                    animations.forEach((x) => {
                        markDown += x + " 2s infinite linear, "
                    })
                    markDown = markDown.slice(0, -2) + ";"

                    key = key.replace(/f\(([^]+)\)/i, "")

                }
                if (key.toLowerCase().includes("cw(")) {
                    var degrees = key.match(/cw\((-*\d+)\)/i)[1]

                    markDown += "display:inline-block; transform:rotate(" + degrees + "deg);"

                    key = key.replace(/cw\((-*\d+)\)/i, "")
                }
                if (key.toLowerCase().includes("hr(")) {
                    var degrees = key.match(/hr\((-*\d+)\)/i)[1]

                    markDown += "filter: hue-rotate(" + degrees + "deg);"

                    key = key.replace(/hr\((-*\d+)\)/i, "")
                }

                if (key.toLowerCase().includes("b")) {
                    var textColor = "white";
                    if (filteredColor) {
                        textColor = filteredColor;
                    }

                    markDown += "text-shadow:0em 0em .1em " + textColor + ",0em 0em .1em " + textColor + ",0em 0em .1em " + textColor + ";"
                }
                if (key.toLowerCase().includes("i")) {
                    markDown += "font-style:italic;"
                }
                if (key.toLowerCase().includes("s")) {
                    markDown += "font-size:.7em;"
                }
                if (key.toLowerCase().includes("l")) {
                    markDown += "font-size:1.4em;"
                }
                if (key.toLowerCase().includes("_")) {
                    textDeco += "underline "
                }
                if (key.toLowerCase().includes("-")) {
                    textDeco += "line-through "
                }
                if (key.toLowerCase().includes("m")) {
                    tagType = "marquee"
                }
                if (key.toLowerCase().includes("q")) {
                    tagType = "blockquote"
                }
                if (key.toLowerCase().includes("h")) {
                    spClass += "spoiler spoilerPrimer"
                    spoiler = 'onclick="event.stopPropagation();this.classList.toggle(\'spoiler\')"';
                }
                //Fonts
                if (key.toLowerCase().includes("~")) {
                    markDown += "font-family: Marck Script;"
                }
                //Rock Salt is awesome
                if (key.toLowerCase().includes("!")) {
                    markDown += "font-family: Trade Winds;"
                }
                if (key.toLowerCase().includes("/")) {
                    markDown += "font-family: Nanum Pen Script;"
                }
                if (key.toLowerCase().includes("\\")) {
                    markDown += "font-family: rock salt;"
                }
                if (key.toLowerCase().includes("j")) {
                    markDown += "font-family: Dela Gothic One;"
                }
                if (key.toLowerCase().includes("w")) {
                    markDown += "font-family: linefont;"
                }
                //Transformations
                if (key.includes("V")) {
                    markDown += "writing-mode:vertical-lr; text-orientation:upright;"
                }
                if (key.includes("v")) {
                    markDown += "writing-mode:vertical-lr; text-orientation:mixed;"
                }
                if (key.toLowerCase().includes("d")) {
                    markDown += "display:inline-block; transform:rotate(90deg); transform-origin:left;"
                }
                if (key.toLowerCase().includes("xy")) {
                    markDown += "display:inline-block; transform:scalex(-1) scaley(-1);"

                    key = key.replace(/xy/i, "")
                }
                if (key.toLowerCase().includes("x")) {
                    markDown += "display:inline-block; transform:scalex(-1);"
                }
                if (key.toLowerCase().includes("y")) {
                    markDown += "display:inline-block; transform:scaley(-1);"
                }
                //Time
                if (key.toLowerCase().includes("t")) {
                    var input = new Date(Date.parse(content));
                    if(input){
                        content = input.toLocaleString();
                    }
                
                }
                


                return "<" + tagType + " style='" + markDown + "text-decoration:" + textDeco + ";' " + spoiler + " class='mark " + spClass + "' " + link + ">" + content + "</" + tagType + ">"

            })
        }
    }

</script>
