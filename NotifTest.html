<button id="notify">Send notification</button>

<style>
    #notify {
        font-size: 10vw;
    }
</style>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import {
        getMessaging,
        getToken
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-messaging.js";
    import {
        getFunctions,
        httpsCallable
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-functions.js";

    const app = initializeApp({
        apiKey: "AIzaSyBunyChVwR7Wq0CeQ1J2vaCUW1onWBXpEU",
        authDomain: "ex-patriot.firebaseapp.com",
        projectId: "ex-patriot",
        messagingSenderId: "407951799946",
        appId: "1:407951799946:web:2b7b91807ef6ed3841df73"
    });

    const messaging = getMessaging(app);
    const functions = getFunctions(app);

    const registration = await navigator.serviceWorker.register(
        "/firebase-messaging-sw.js"
    );

    const token = await getToken(messaging, {
        vapidKey: "BFfxPRd6B-zsg1d5YrBm7kqavg1nZXHa0bhEhXZ2OCTC00Io_QDhbqo6Q8-9bGluntomfmsbU0-HTdAnL8nQq4Q",
        serviceWorkerRegistration: registration
    });

    // Register this browser with the server.
    await httpsCallable(functions, "registerToken")({
        token
    });

    document.querySelector("#notify").onclick = async () => {
        try {
            await httpsCallable(functions, "notify")({
                senderToken: token
            });

            console.log("Notification sent.");
        } catch (error) {
            console.error("Notification failed:", error);
        }
    };
</script>
