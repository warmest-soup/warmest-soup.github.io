    var results = Array.from(codebreaker.innerHTML.match(/https:\/\/stickershop\.line-scdn\.net\/stickershop\/v1\/sticker\/\d+\/android\/sticker\.png\?v=1/g))

    codebreaker.innerHTML = "";

    })
</script>
