<!doctype html>
<html>
  <body>
    <h2>WebRTC Call</h2>

    <button id="create">Create Call</button>
    <input id="id" placeholder="Call ID" />
    <button id="join">Join Call</button>

    <p>Call ID: <b id="callId"></b></p>

    <video id="local" autoplay muted playsinline width="400"></video>
    <video id="remote" autoplay playsinline width="400"></video>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
      import {
        getDatabase,
        ref,
        push,
        set,
        get,
        onValue,
        onChildAdded
      } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDQQ3o3BDkO1tlbuTxtNwBPGXA9WU-0hQ",
        authDomain: "rattraps-3rd-edition.firebaseapp.com",
        databaseURL:
          "https://rattraps-3rd-edition-default-rtdb.firebaseio.com",
        projectId: "rattraps-3rd-edition",
        storageBucket: "rattraps-3rd-edition.firebasestorage.app",
        messagingSenderId: "462515270404",
        appId: "1:462515270404:web:bc1222161ed1691e2e9651"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      const rtc = {
        iceServers: [
          {
            urls: "stun:stun.l.google.com:19302"
          }
        ]
      };

      let pc;
      let localStream;
      let remoteStream;

      /*
       * Get whatever media devices are available.
       *
       * Camera and microphone are both optional.
       * If getUserMedia() fails, we continue with an
       * empty MediaStream instead of killing the call.
       */
      async function getAvailableMedia() {
        const stream = new MediaStream();

        // Try microphone independently.
        try {
          const audioStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: false
          });

          audioStream.getAudioTracks().forEach((track) => {
            stream.addTrack(track);
          });
        } catch (error) {
          console.warn("Microphone unavailable:", error);
        }

        // Try camera independently.
        try {
          const videoStream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: true
          });

          videoStream.getVideoTracks().forEach((track) => {
            stream.addTrack(track);
          });
        } catch (error) {
          console.warn("Camera unavailable:", error);
        }

        return stream;
      }

      async function setup() {
        /*
         * This no longer requires a camera.
         * It also doesn't require a microphone.
         */
        localStream = await getAvailableMedia();
        local.srcObject = localStream;

        remoteStream = new MediaStream();
        remote.srcObject = remoteStream;

        pc = new RTCPeerConnection(rtc);

        /*
         * Add whatever local tracks exist.
         */
        localStream.getTracks().forEach((track) => {
          pc.addTrack(track, localStream);
        });

        /*
         * Receive remote tracks.
         */
        pc.ontrack = (event) => {
          event.streams.forEach((stream) => {
            stream.getTracks().forEach((track) => {
              // Avoid adding the same track twice.
              if (
                !remoteStream
                  .getTracks()
                  .some((t) => t.id === track.id)
              ) {
                remoteStream.addTrack(track);
              }
            });
          });
        };

        pc.onconnectionstatechange = () => {
          console.log("Connection state:", pc.connectionState);
        };

        pc.oniceconnectionstatechange = () => {
          console.log("ICE state:", pc.iceConnectionState);
        };

        console.log(
          "Local audio tracks:",
          localStream.getAudioTracks().length
        );

        console.log(
          "Local video tracks:",
          localStream.getVideoTracks().length
        );
      }

      /* =========================
         CREATE CALL
         ========================= */

      create.onclick = async () => {
        try {
          await setup();

          // Generate a unique call ID.
          const callRef = push(ref(db, "calls"));
          const callIdValue = callRef.key;

          callId.textContent = callIdValue;

          const callerCandidatesRef = ref(
            db,
            `calls/${callIdValue}/callerCandidates`
          );

          const calleeCandidatesRef = ref(
            db,
            `calls/${callIdValue}/calleeCandidates`
          );

          // Send caller ICE candidates.
          pc.onicecandidate = async (event) => {
            if (event.candidate) {
              const candidateRef = push(callerCandidatesRef);

              await set(
                candidateRef,
                event.candidate.toJSON()
              );
            }
          };

          // Create offer.
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);

          // Store offer.
          await set(
            ref(db, `calls/${callIdValue}/offer`),
            {
              type: offer.type,
              sdp: offer.sdp
            }
          );

          // Wait for answer.
          onValue(
            ref(db, `calls/${callIdValue}/answer`),
            async (snapshot) => {
              const answer = snapshot.val();

              if (answer && !pc.currentRemoteDescription) {
                await pc.setRemoteDescription(answer);
              }
            }
          );

          // Listen for callee ICE candidates.
          onChildAdded(
            calleeCandidatesRef,
            async (snapshot) => {
              const candidate = snapshot.val();

              if (candidate) {
                try {
                  await pc.addIceCandidate(
                    new RTCIceCandidate(candidate)
                  );
                } catch (error) {
                  console.warn(
                    "Could not add remote ICE candidate:",
                    error
                  );
                }
              }
            }
          );
        } catch (error) {
          console.error(
            "Could not create call:",
            error
          );

          alert(
            "Could not create the call. Check the console for details."
          );
        }
      };

      /* =========================
         JOIN CALL
         ========================= */

      join.onclick = async () => {
        try {
          const callIdValue = id.value.trim();

          if (!callIdValue) {
            alert("Enter a Call ID");
            return;
          }

          /*
           * Check the call BEFORE requesting devices.
           */
          const callRef = ref(
            db,
            `calls/${callIdValue}`
          );

          const snapshot = await get(callRef);

          if (!snapshot.exists()) {
            alert("Call not found");
            return;
          }

          await setup();

          const callData = snapshot.val();

          const callerCandidatesRef = ref(
            db,
            `calls/${callIdValue}/callerCandidates`
          );

          const calleeCandidatesRef = ref(
            db,
            `calls/${callIdValue}/calleeCandidates`
          );

          // Send callee ICE candidates.
          pc.onicecandidate = async (event) => {
            if (event.candidate) {
              const candidateRef = push(
                calleeCandidatesRef
              );

              await set(
                candidateRef,
                event.candidate.toJSON()
              );
            }
          };

          // Apply caller's offer.
          await pc.setRemoteDescription(
            callData.offer
          );

          // Create answer.
          const answer = await pc.createAnswer();

          await pc.setLocalDescription(answer);

          // Store answer.
          await set(
            ref(db, `calls/${callIdValue}/answer`),
            {
              type: answer.type,
              sdp: answer.sdp
            }
          );

          // Listen for caller ICE candidates.
          onChildAdded(
            callerCandidatesRef,
            async (snapshot) => {
              const candidate = snapshot.val();

              if (candidate) {
                try {
                  await pc.addIceCandidate(
                    new RTCIceCandidate(candidate)
                  );
                } catch (error) {
                  console.warn(
                    "Could not add remote ICE candidate:",
                    error
                  );
                }
              }
            }
          );
        } catch (error) {
          console.error(
            "Could not join call:",
            error
          );

          alert(
            "Could not join the call. Check the console for details."
          );
        }
      };
    </script>
  </body>
</html>
